# TODO: replace with the production URL once the site is deployed
# (canonical links, sitemap and RSS are built from it).
baseURL = "http://localhost:1313/"
locale = "en-us"
title = "Celeste Guimapi"

theme = "PaperMod"

[params]
    env = "production"

    # Single source for the one-line profile: reused by the homepage,
    # the <meta name="description"> fallback and the footer.
    description = "PhD student at IMT Atlantique working on the energy efficiency of cloud and serverless applications."
    author = "Celeste Guimapi"

    affiliation = "IMT Atlantique · LS2N (STACK team) · Nantes, France"
    email = "celeste-precil.guimapi-guefack@imt-atlantique.fr"

    # Replace with a real photo (e.g. /images/profile/celeste.jpg) when available.
    profileImage = "/images/profile/placeholder.svg"

    defaultTheme = "auto"
    disableThemeToggle = false

    ShowReadingTime = true
    ShowShareButtons = false
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowWordCount = false

    disableSpecial1stPost = true
    hidemeta = false
    hideSummary = false

    [params.assets]
        # One SVG icon for every slot PaperMod links in <head>.
        favicon = "/favicon.svg"
        favicon16x16 = "/favicon.svg"
        favicon32x32 = "/favicon.svg"
        apple_touch_icon = "/favicon.svg"
        safari_pinned_tab = "/favicon.svg"

    [[params.supervisors]]
        name = "Jean-Marc Menaud"
        role = "Professor, IMT Atlantique"
        url = "http://menaud.fr/"

    [[params.supervisors]]
        name = "Remous-Aris Koutsiamanis"
        role = "Senior Lecturer, IMT Atlantique"
        url = "https://ariskou.com/"

    [[params.socialIcons]]
        name = "email"
        title = "Email"
        url = "mailto:celeste-precil.guimapi-guefack@imt-atlantique.fr"

    [[params.socialIcons]]
        name = "orcid"
        title = "ORCID"
        url = "https://orcid.org/0009-0009-6548-0635"

    [[params.socialIcons]]
        name = "github"
        title = "GitHub"
        url = "https://github.com/Guimapi1"

[menu]

    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 10

    [[menu.main]]
        identifier = "research"
        name = "Research"
        url = "/research/"
        weight = 20

    [[menu.main]]
        identifier = "publications"
        name = "Publications"
        url = "/publications/"
        weight = 30

    [[menu.main]]
        identifier = "cv"
        name = "CV"
        url = "/cv/"
        weight = 40

[markup]

    [markup.highlight]
        noClasses = false
        lineNos = false
        codeFences = true
        guessSyntax = true
        style = "github"

    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
